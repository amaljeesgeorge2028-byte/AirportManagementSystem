
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airport-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: airport
  template:
    metadata:
      labels:
        app: airport
    spec:
      containers:
        - name: airport-container
          image: airport-management-system:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
